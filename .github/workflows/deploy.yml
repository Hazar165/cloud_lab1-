name: Deploy

on:
  push:
    branches:
      - main

permissions:
  id-token: write
  contents: read

jobs:
  deploy:
    name: Build and deploy
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Log in to Azure
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Build, push, and update Container App
        env:
          IMAGE_TAG: ${{ github.sha }}
        run: |
          set -euo pipefail
          acr_name="$(az acr list --resource-group lab1-rg --query '[0].name' --output tsv)"
          login_server="$(az acr list --resource-group lab1-rg --query '[0].loginServer' --output tsv)"
          image="${login_server}/lab1-api:${IMAGE_TAG}"

          az acr login --name "$acr_name"
          docker build -t "$image" ./app
          docker push "$image"
          az containerapp update \
            --name lab1-api \
            --resource-group lab1-rg \
            --image "$image"
